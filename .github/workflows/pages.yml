name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pull requests build the known project path even before Pages is enabled.
      # configure-pages is skipped on pull_request: enablement needs a non-PR run
      # or the first deploy fails with "Get Pages site failed ... Not Found".
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Pull requests build the known project path even before Pages is enabled.
      # Pushes read the live Pages base path so a later custom domain still works.
      - name: Build for Pages base path
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="/robotics-pick-and-place"
          else
            BASE="${{ steps.pages.outputs.base_path }}"
          fi
          npm run build -- --base "${BASE}/"
        env:
          # The public bundle must not contain an API key.
          NUWA_API_KEY: ""

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
